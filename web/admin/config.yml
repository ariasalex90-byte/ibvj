# ════════════════════════════════════════════════════════════════
# Configuración del panel de administración (Sveltia CMS)
# Define qué puede editar el usuario sin tocar código.
# ════════════════════════════════════════════════════════════════

backend:
  name: github
  repo: ariasalex90-byte/ibvj
  branch: main
  # Conector de autenticación (Cloudflare Worker) que hace el login seguro.
  base_url: https://sveltia-cms-auth.arias-alex90.workers.dev

# Carpeta donde se guardan las fotos que suba el usuario (relativa a la raíz del repo).
media_folder: "web/assets/images"
# Ruta pública de esas fotos en el sitio publicado.
public_folder: "/assets/images"

# Idioma del panel
locale: es

site_url: https://iglesiabautistavallejosafat.com

collections:
  - name: anuncios
    label: "Anuncios"
    label_singular: "Anuncios"
    description: "Peticiones de oración y eventos de la agenda que aparecen en la página de Anuncios."
    files:
      - name: contenido
        label: "Peticiones y Agenda"
        file: "web/content/anuncios.json"
        description: "Edita las tarjetas de Peticiones de Oración y de la Agenda."
        fields:
          - label: "Peticiones de Oración"
            name: peticiones
            widget: list
            label_singular: "Petición"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Descripción", name: descripcion, widget: text }
              - label: "Ícono"
                name: icono
                widget: select
                default: "fa-hands-praying"
                options:
                  - { label: "Oración (manos)", value: "fa-hands-praying" }
                  - { label: "Personas / familia", value: "fa-users" }
                  - { label: "Persona", value: "fa-person" }
                  - { label: "Nuevo miembro", value: "fa-user-plus" }
                  - { label: "Niños", value: "fa-child" }
                  - { label: "Corazón", value: "fa-heart" }
                  - { label: "Iglesia", value: "fa-church" }
                  - { label: "Mundo / misiones", value: "fa-globe" }

          - label: "Agenda (Eventos)"
            name: eventos
            widget: list
            label_singular: "Evento"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Descripción", name: descripcion, widget: text, required: false }
              - { label: "Cuándo (día y hora)", name: cuando, widget: string, required: false, hint: "Ej.: Domingos · 9:00 AM" }
              - { label: "Lugar", name: lugar, widget: string, required: false, hint: "Ej.: En la iglesia · Presencial" }
              - label: "Ícono"
                name: icono
                widget: select
                default: "fa-calendar-check"
                options:
                  - { label: "Calendario", value: "fa-calendar-check" }
                  - { label: "Niños", value: "fa-child" }
                  - { label: "Jóvenes (fuego)", value: "fa-fire" }
                  - { label: "Fútbol / deporte", value: "fa-futbol" }
                  - { label: "Café", value: "fa-mug-hot" }
                  - { label: "Iglesia", value: "fa-church" }
                  - { label: "Oración (manos)", value: "fa-hands-praying" }
                  - { label: "Campamento", value: "fa-campground" }
              - { label: "Etiqueta (opcional)", name: etiqueta, widget: string, required: false, hint: "Ej.: Cambio de fecha. Déjalo vacío si no aplica." }

          - label: "Programación de oración"
            name: programacion
            widget: object
            fields:
              - label: "Horario semanal (tabla)"
                name: horario
                widget: list
                label_singular: "Fila"
                summary: "{{fields.ministerio}} — {{fields.dia}}"
                fields:
                  - { label: "Ministerio", name: ministerio, widget: string }
                  - { label: "Día", name: dia, widget: string }
                  - { label: "Hora", name: hora, widget: string }
                  - { label: "Líder", name: lider, widget: string }
                  - label: "Ícono"
                    name: icono
                    widget: select
                    default: "fa-church"
                    options:
                      - { label: "Corazón (Damas)", value: "fa-heart" }
                      - { label: "Persona (Caballeros)", value: "fa-person" }
                      - { label: "Rayo (Jóvenes)", value: "fa-bolt" }
                      - { label: "Iglesia (Congregación)", value: "fa-church" }
              - label: "Contactos de líderes"
                name: lideres
                widget: list
                label_singular: "Líder"
                summary: "{{fields.grupo}}"
                fields:
                  - { label: "Grupo", name: grupo, widget: string }
                  - { label: "Nombre", name: nombre, widget: string }
                  - label: "Teléfonos"
                    name: telefonos
                    widget: list
                    field: { label: "Teléfono", name: telefono, widget: string }
                  - label: "Ícono"
                    name: icono
                    widget: select
                    default: "fa-person"
                    options:
                      - { label: "Corazón", value: "fa-heart" }
                      - { label: "Persona", value: "fa-person" }
                      - { label: "Rayo", value: "fa-bolt" }

          - label: "Jueves de Oración"
            name: jueves
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Frase", name: frase, widget: string }
              - { label: "Horario", name: horario, widget: string, hint: "Ej.: Jueves de oración presencial · 6:45 PM" }
              - { label: "Descripción", name: descripcion, widget: text }
              - { label: "Teléfono del botón", name: telefono, widget: string }

          - label: "Madres y Abuelas que Oran"
            name: madres
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Descripción", name: descripcion, widget: text }
              - { label: "Cuándo", name: cuando, widget: string, hint: "Ej.: Cada Sábado a las 6:00 A.M." }
              - { label: "Modo", name: modo, widget: string, hint: "Ej.: Vía Zoom" }
              - { label: "Nombre de contacto", name: contacto, widget: string }
              - { label: "Teléfono", name: telefono, widget: string }

          - label: "Ministerios de Provisión"
            name: provision
            widget: list
            label_singular: "Provisión"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Descripción", name: descripcion, widget: text }
              - { label: "Nombre de contacto", name: contacto, widget: string }
              - { label: "Teléfono", name: telefono, widget: string, required: false }
              - label: "Ícono"
                name: icono
                widget: select
                default: "fa-hands-holding-heart"
                options:
                  - { label: "Galleta (refrigerio)", value: "fa-cookie-bite" }
                  - { label: "Camisa (ropa)", value: "fa-shirt" }
                  - { label: "Canasta", value: "fa-basket-shopping" }
                  - { label: "Aseo", value: "fa-spray-can-sparkles" }
                  - { label: "Corazón", value: "fa-heart" }
                  - { label: "Manos con corazón", value: "fa-hands-holding-heart" }
              - label: "Color"
                name: color
                widget: select
                default: "orange"
                options:
                  - { label: "Naranja", value: "orange" }
                  - { label: "Azul", value: "blue" }
                  - { label: "Verde", value: "green" }
                  - { label: "Turquesa", value: "teal" }

          - label: "Redes sociales (tarjetas de la página)"
            name: redes
            widget: list
            label_singular: "Red"
            summary: "{{fields.titulo}}"
            fields:
              - label: "Tipo"
                name: tipo
                widget: select
                options:
                  - { label: "YouTube", value: "youtube" }
                  - { label: "Facebook", value: "facebook" }
                  - { label: "Instagram", value: "instagram" }
                  - { label: "WhatsApp", value: "whatsapp" }
              - { label: "Título", name: titulo, widget: string }
              - { label: "Descripción", name: descripcion, widget: string }
              - { label: "Enlace (URL)", name: url, widget: string }
              - { label: "Texto del botón", name: cta, widget: string }

          - label: "Ministerio de Consolación"
            name: consolacion
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Subtítulo", name: subtitulo, widget: string }
              - { label: "Descripción", name: descripcion, widget: text }
              - label: "Contactos"
                name: contactos
                widget: list
                label_singular: "Contacto"
                summary: "{{fields.nombre}}"
                fields:
                  - { label: "Nombre", name: nombre, widget: string }
                  - { label: "Teléfono", name: telefono, widget: string }

  - name: contacto
    label: "Contacto (pie de página)"
    label_singular: "Contacto"
    description: "Correo, dirección y redes sociales que aparecen en el pie de página de todo el sitio."
    files:
      - name: contenido
        label: "Datos de contacto"
        file: "web/content/contacto.json"
        description: "Correo, dirección y enlaces de redes sociales."
        fields:
          - { label: "Correo electrónico", name: email, widget: string }
          - { label: "Dirección", name: direccion, widget: string }
          - { label: "WhatsApp (solo números, ej. 573001234567)", name: whatsapp, widget: string }
          - label: "Redes sociales"
            name: redes
            widget: object
            fields:
              - { label: "Facebook (URL)", name: facebook, widget: string }
              - { label: "Instagram (URL)", name: instagram, widget: string }
              - { label: "YouTube (URL)", name: youtube, widget: string }

  - name: inicio
    label: "Página principal"
    label_singular: "Página principal"
    description: "Textos de la página principal: bienvenida, horarios, mensaje del pastor, doctrina y misiones."
    files:
      - name: contenido
        label: "Textos de la página principal"
        file: "web/content/inicio.json"
        description: "Edita los textos y horarios de la página de inicio."
        fields:
          - label: "Bienvenida"
            name: bienvenida
            widget: object
            fields:
              - { label: "Título", name: titulo, widget: string }
              - { label: "Frase principal", name: lead, widget: string }
              - { label: "Párrafo 1", name: parrafo1, widget: text }
              - { label: "Párrafo 2", name: parrafo2, widget: text }
          - label: "Horarios de servicio"
            name: horarios
            widget: object
            fields:
              - { label: "Subtítulo", name: subtitulo, widget: string }
              - label: "Servicios (tarjetas)"
                name: servicios
                widget: list
                label_singular: "Servicio"
                summary: "{{fields.nombre}} — {{fields.hora}}"
                fields:
                  - { label: "Día", name: dia, widget: string }
                  - { label: "Nombre", name: nombre, widget: string }
                  - { label: "Hora", name: hora, widget: string }
                  - label: "Ícono"
                    name: icono
                    widget: select
                    default: "fa-church"
                    options:
                      - { label: "Libro abierto (escuela)", value: "fa-book-open" }
                      - { label: "Iglesia", value: "fa-church" }
                      - { label: "Oración (manos)", value: "fa-hands-praying" }
                      - { label: "Biblia", value: "fa-book-bible" }
                  - { label: "¿Destacado?", name: destacado, widget: boolean, default: false }
              - { label: "Nota de oración", name: nota_oracion, widget: text }
          - label: "Mensaje del pastor"
            name: pastor
            widget: object
            fields:
              - { label: "Etiqueta (años en el ministerio)", name: badge, widget: string }
              - label: "Párrafos del mensaje"
                name: parrafos
                widget: list
                field: { label: "Párrafo", name: parrafo, widget: text }
              - { label: "Nombre", name: nombre, widget: string }
              - { label: "Cargo", name: cargo, widget: string }
          - label: "Sana doctrina"
            name: doctrina
            widget: object
            fields:
              - { label: "Versículo", name: versiculo, widget: text }
              - { label: "Referencia del versículo", name: versiculo_ref, widget: string }
              - { label: "Descripción", name: descripcion, widget: text }
              - { label: "Leyenda de la Biblia", name: biblia_caption, widget: string }
          - label: "Evangelismo y misiones"
            name: misiones
            widget: object
            fields:
              - { label: "Frase principal", name: lead, widget: string }
              - { label: "Descripción", name: descripcion, widget: text }
              - label: "Puntos (lista con viñetas)"
                name: puntos
                widget: list
                field: { label: "Punto", name: punto, widget: string }

  - name: ministerios
    label: "Ministerios"
    label_singular: "Ministerios"
    description: "Las tarjetas con fotos de la sección 'Nuestros ministerios' en la página principal."
    files:
      - name: contenido
        label: "Nuestros ministerios"
        file: "web/content/ministerios.json"
        description: "Agrega, edita o reordena los ministerios y sus fotos."
        fields:
          - label: "Ministerios"
            name: ministerios
            widget: list
            label_singular: "Ministerio"
            summary: "{{fields.nombre}}"
            fields:
              - { label: "Nombre", name: nombre, widget: string }
              - { label: "Descripción", name: descripcion, widget: text }
              - { label: "Foto", name: foto, widget: image, hint: "Sube una foto (de preferencia cuadrada). Se recorta automáticamente." }
              - label: "Ícono"
                name: icono
                widget: select
                default: "fa-church"
                options:
                  - { label: "Iglesia", value: "fa-church" }
                  - { label: "Biblia", value: "fa-book-bible" }
                  - { label: "Familia (techo)", value: "fa-people-roof" }
                  - { label: "Música / alabanza", value: "fa-music" }
                  - { label: "Corazón", value: "fa-heart" }
                  - { label: "Persona", value: "fa-person" }
                  - { label: "Jóvenes (fuego)", value: "fa-fire" }
                  - { label: "Niños", value: "fa-child" }
                  - { label: "Oración (manos)", value: "fa-hands-praying" }
                  - { label: "Mundo / misiones", value: "fa-globe" }
                  - { label: "Redes / comunicación", value: "fa-share-nodes" }
                  - { label: "Anuncios (megáfono)", value: "fa-bullhorn" }
